name: PowerShell unit tests

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/powershell-tests.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/powershell-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pester:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Pester 5
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module Pester -RequiredVersion 5.9.1 -Scope CurrentUser -Force -SkipPublisherCheck -ErrorAction Stop
          Import-Module Pester -RequiredVersion 5.9.1 -ErrorAction Stop
      - name: Run mocked unit tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Pester -RequiredVersion 5.9.1 -ErrorAction Stop
          $config = New-PesterConfiguration
          $config.Run.Path = '.\tests\Get-AstraADHealth.Tests.ps1'
          $config.Run.PassThru = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = 'NUnitXml'
          $config.TestResult.OutputPath = 'test-results.xml'
          $result = Invoke-Pester -Configuration $config
          if ($result.FailedCount -gt 0 -or $result.PassedCount -eq 0) {
            throw "Unit tests failed or no tests ran. Passed: $($result.PassedCount); Failed: $($result.FailedCount)."
          }
      - name: Upload mock test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-test-results
          path: test-results.xml
          if-no-files-found: ignore
          retention-days: 7

# The test suite mocks all Active Directory queries and module import.
# No lab credentials, network access, secrets or live directory connection are required.
# A passing CI run does not establish the health of any real Active Directory domain.
